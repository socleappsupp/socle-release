name: Sign existing macOS release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v2.0.20"
        required: true
        type: string
      cleanup_temp_assets:
        description: "Delete .temp release assets after final assets are published"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  sign-existing-macos-assets:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: macos-arm64
            asset_name: Socle-macos-arm64.zip
            temp_asset_name: Socle-macos-arm64.zip.temp
          - rid: macos-x64
            asset_name: Socle-macos-x64.zip
            temp_asset_name: Socle-macos-x64.zip.temp

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: temporary-build-keychain-password
        run: |
          set -euo pipefail

          printf "%s" "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > developer_id_application.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          security import developer_id_application.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          security find-identity -v -p codesigning

      - name: Download existing release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p input

          gh release download "${{ github.event.inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ matrix.temp_asset_name }}" \
            --dir input

          echo "Downloaded input files:"
          ls -la input

      - name: Extract release asset
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          ditto -x -k "input/${{ matrix.temp_asset_name }}" extracted

          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | sort | head -200

      - name: Build Socle.app bundle from extracted binaries
        run: |
          set -euo pipefail

          rm -rf Socle.app
          mkdir -p Socle.app/Contents/MacOS
          mkdir -p Socle.app/Contents/Resources

          EXISTING_APP=$(find extracted -maxdepth 5 -name "Socle.app" -type d | head -n 1 || true)

          if [ -n "$EXISTING_APP" ]; then
            echo "Existing Socle.app found: $EXISTING_APP"

            rm -rf Socle.app
            cp -R "$EXISTING_APP" ./Socle.app
          else
            echo "No Socle.app found. Creating app bundle from raw publish folder."

            SOCLE_EXEC=$(find extracted -type f -name "Socle" | head -n 1 || true)

            if [ -z "$SOCLE_EXEC" ]; then
              echo "Could not find Socle executable."
              echo "Extracted files:"
              find extracted -maxdepth 8 -type f | sort
              exit 1
            fi

            SOCLE_DIR=$(dirname "$SOCLE_EXEC")
            echo "Using Socle publish directory: $SOCLE_DIR"

            cp -R "$SOCLE_DIR"/* Socle.app/Contents/MacOS/
          fi

          if [ ! -f "Socle.app/Contents/MacOS/Socle" ]; then
            echo "Socle executable was not found in Socle.app/Contents/MacOS."
            echo "Current app bundle files:"
            find Socle.app -maxdepth 6 -type f | sort
            exit 1
          fi

          if [ ! -f "Socle.app/Contents/MacOS/Socle-updater" ]; then
            echo "Socle-updater executable was not found in Socle.app/Contents/MacOS."
            echo "Current app bundle files:"
            find Socle.app -maxdepth 6 -type f | sort
            exit 1
          fi

          chmod 755 Socle.app/Contents/MacOS/Socle
          chmod 755 Socle.app/Contents/MacOS/Socle-updater

          find Socle.app/Contents/MacOS -type f \( \
            -name "*.dylib" -o \
            -name "*.sh" \
          \) -print0 | while IFS= read -r -d '' file; do
            chmod 755 "$file"
          done

          find Socle.app/Contents/MacOS -maxdepth 1 -type f \( \
            -iname "README.txt" -o \
            -iname "README.md" -o \
            -iname "VERSION.txt" \
          \) -print0 | while IFS= read -r -d '' file; do
            echo "Moving non-code file to Resources: $file"
            mv "$file" Socle.app/Contents/Resources/
          done

          VERSION="${{ github.event.inputs.tag }}"
          VERSION="${VERSION#v}"

          cat > Socle.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Socle</string>
            <key>CFBundleDisplayName</key>
            <string>Socle</string>
            <key>CFBundleIdentifier</key>
            <string>com.socleappsupp.socle</string>
            <key>CFBundleVersion</key>
            <string>$VERSION</string>
            <key>CFBundleShortVersionString</key>
            <string>$VERSION</string>
            <key>CFBundleExecutable</key>
            <string>Socle</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          echo "Created app bundle:"
          find Socle.app -maxdepth 5 -type f | sort | head -200
          echo "Executable payload:"
          ls -l Socle.app/Contents/MacOS/Socle Socle.app/Contents/MacOS/Socle-updater
          test -x Socle.app/Contents/MacOS/Socle
          test -x Socle.app/Contents/MacOS/Socle-updater

      - name: Create entitlements
        run: |
          set -euo pipefail

          cat > entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Sign Socle.app
        run: |
          set -euo pipefail

          SIGN_IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -n 1 | sed -E 's/.*"(.+)"/\1/')

          if [ -z "$SIGN_IDENTITY" ]; then
            echo "Developer ID Application signing identity not found."
            security find-identity -v -p codesigning
            exit 1
          fi

          echo "Using signing identity: $SIGN_IDENTITY"

          echo "Signing dynamic libraries first..."
          find Socle.app/Contents/MacOS -type f -name "*.dylib" -print0 | while IFS= read -r -d '' file; do
            if file "$file" | grep -q "Mach-O"; then
              echo "Signing dylib: $file"
              codesign \
                --force \
                --timestamp \
                --options runtime \
                --entitlements entitlements.plist \
                --sign "$SIGN_IDENTITY" \
                "$file"
            fi
          done

          echo "Signing executable Mach-O files..."
          find Socle.app/Contents/MacOS -type f ! -name "*.dylib" -print0 | while IFS= read -r -d '' file; do
            if file "$file" | grep -q "Mach-O"; then
              echo "Signing executable: $file"
              codesign \
                --force \
                --timestamp \
                --options runtime \
                --entitlements entitlements.plist \
                --sign "$SIGN_IDENTITY" \
                "$file"
            fi
          done

          echo "Signing app bundle..."
          codesign \
            --force \
            --timestamp \
            --options runtime \
            --entitlements entitlements.plist \
            --sign "$SIGN_IDENTITY" \
            Socle.app

          codesign --verify --deep --strict --verbose=2 Socle.app

      - name: Create ZIP for notarization
        run: |
          set -euo pipefail

          rm -f "notarization-${{ matrix.asset_name }}"
          ditto -c -k --keepParent Socle.app "notarization-${{ matrix.asset_name }}"

          echo "Notarization ZIP:"
          ls -lh "notarization-${{ matrix.asset_name }}"
          shasum -a 256 "notarization-${{ matrix.asset_name }}"

      - name: Notarize ZIP
        id: notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail

          ZIP_PATH="notarization-${{ matrix.asset_name }}"
          STATUS_FILE="notarization-status-${{ matrix.rid }}.json"
          LOG_FILE="notarization-log-${{ matrix.rid }}.txt"

          MAX_ATTEMPTS=360
          SLEEP_SECONDS=30
          TIMEOUT_MINUTES=$((MAX_ATTEMPTS * SLEEP_SECONDS / 60))

          echo "Submitting notarization request for $ZIP_PATH"
          echo "Timeout: $TIMEOUT_MINUTES minutes"

          SUBMISSION_OUTPUT=$(xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --output-format json)

          echo "$SUBMISSION_OUTPUT" | tee "$STATUS_FILE"

          SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | /usr/bin/python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          echo "Notarization submission id: $SUBMISSION_ID"

          {
            echo "submission_id=$SUBMISSION_ID"
            echo "status=Submitted"
            echo "accepted=false"
          } >> "$GITHUB_OUTPUT"

          FINAL_STATUS="Submitted"

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Checking notarization status. Attempt $i/$MAX_ATTEMPTS..."

            INFO_OUTPUT=$(xcrun notarytool info "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --output-format json)

            echo "$INFO_OUTPUT" | tee "$STATUS_FILE"

            STATUS=$(echo "$INFO_OUTPUT" | /usr/bin/python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            FINAL_STATUS="$STATUS"

            echo "Current notarization status: $STATUS"

            if [ "$STATUS" = "Accepted" ]; then
              echo "Notarization accepted."

              {
                echo "submission_id=$SUBMISSION_ID"
                echo "status=Accepted"
                echo "accepted=true"
              } >> "$GITHUB_OUTPUT"

              {
                echo "## Notarization accepted"
                echo ""
                echo "- RID: \`${{ matrix.rid }}\`"
                echo "- Asset: \`${{ matrix.asset_name }}\`"
                echo "- Submission ID: \`$SUBMISSION_ID\`"
                echo "- Timeout limit: \`$TIMEOUT_MINUTES minutes\`"
              } >> "$GITHUB_STEP_SUMMARY"

              exit 0
            fi

            if [ "$STATUS" = "Invalid" ] || [ "$STATUS" = "Rejected" ]; then
              echo "Notarization failed with status: $STATUS"
              echo "Fetching notarization log..."

              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" | tee "$LOG_FILE"

              {
                echo "## Notarization failed"
                echo ""
                echo "- RID: \`${{ matrix.rid }}\`"
                echo "- Asset: \`${{ matrix.asset_name }}\`"
                echo "- Submission ID: \`$SUBMISSION_ID\`"
                echo "- Status: \`$STATUS\`"
                echo ""
                echo "The notarization log was saved as \`$LOG_FILE\`."
              } >> "$GITHUB_STEP_SUMMARY"

              exit 1
            fi

            sleep "$SLEEP_SECONDS"
          done

          echo "Notarization did not complete within $TIMEOUT_MINUTES minutes."
          echo "Final known status: $FINAL_STATUS"
          echo "Submission ID: $SUBMISSION_ID"
          echo "This is treated as pending Apple notarization, not as package validation failure."

          echo "Fetching latest notarization info..."

          xcrun notarytool info "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --output-format json | tee "$STATUS_FILE" || true

          echo "Trying to fetch notarization log, if available..."

          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" | tee "$LOG_FILE" || true

          {
            echo "submission_id=$SUBMISSION_ID"
            echo "status=$FINAL_STATUS"
            echo "accepted=false"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Notarization still pending"
            echo ""
            echo "- RID: \`${{ matrix.rid }}\`"
            echo "- Asset: \`${{ matrix.asset_name }}\`"
            echo "- Submission ID: \`$SUBMISSION_ID\`"
            echo "- Final known status: \`$FINAL_STATUS\`"
            echo "- Timeout limit: \`$TIMEOUT_MINUTES minutes\`"
            echo ""
            echo "The final release asset was not overwritten because notarization was not accepted yet."
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Upload notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-diagnostics-${{ matrix.rid }}
          path: |
            notarization-status-${{ matrix.rid }}.json
            notarization-log-${{ matrix.rid }}.txt
          if-no-files-found: ignore

      - name: Staple notarization ticket
        if: steps.notarize.outputs.accepted == 'true'
        run: |
          set -euo pipefail

          xcrun stapler staple Socle.app
          xcrun stapler validate Socle.app
          spctl --assess --type execute --verbose Socle.app

      - name: Create final signed ZIP
        if: steps.notarize.outputs.accepted == 'true'
        run: |
          set -euo pipefail

          rm -f "${{ matrix.asset_name }}"
          ditto -c -k --keepParent Socle.app "${{ matrix.asset_name }}"

          echo "Final signed ZIP:"
          ls -lh "${{ matrix.asset_name }}"
          shasum -a 256 "${{ matrix.asset_name }}"

      - name: Upload signed ZIP as workflow artifact
        if: steps.notarize.outputs.accepted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-zip-${{ matrix.rid }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

      - name: Report pending notarization
        if: steps.notarize.outputs.accepted != 'true'
        run: |
          set -euo pipefail

          echo "Notarization was not accepted during this run."
          echo "Status: ${{ steps.notarize.outputs.status }}"
          echo "Submission ID: ${{ steps.notarize.outputs.submission_id }}"
          echo "Final release assets were not published."
          exit 1

  finalize-release-assets:
    needs: sign-existing-macos-assets
    runs-on: ubuntu-latest

    steps:
      - name: Download signed macOS ZIP artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: signed-zip-*
          path: signed
          merge-multiple: true

      - name: Download staged release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p staged

          gh release download "${{ github.event.inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "Socle-win-x64.zip.temp" \
            --dir staged

          gh release download "${{ github.event.inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "socle-update.xml.temp" \
            --dir staged

          echo "Staged release assets:"
          ls -la staged

          echo "Signed macOS artifacts:"
          ls -la signed

      - name: Create final release assets and manifest
        run: |
          set -euo pipefail

          mkdir -p final

          python3 <<'PY'
          import hashlib
          import pathlib
          import shutil
          import xml.etree.ElementTree as ET

          staged = pathlib.Path("staged")
          signed = pathlib.Path("signed")
          final = pathlib.Path("final")

          assets = {
              ("windows", "x64"): {
                  "source": staged / "Socle-win-x64.zip.temp",
                  "final_name": "Socle-win-x64.zip",
              },
              ("macos", "arm64"): {
                  "source": signed / "Socle-macos-arm64.zip",
                  "final_name": "Socle-macos-arm64.zip",
              },
              ("macos", "x64"): {
                  "source": signed / "Socle-macos-x64.zip",
                  "final_name": "Socle-macos-x64.zip",
              },
          }

          for descriptor in assets.values():
              source = descriptor["source"]
              if not source.is_file():
                  raise FileNotFoundError(f"Missing required asset: {source}")
              shutil.copyfile(source, final / descriptor["final_name"])

          manifest_path = staged / "socle-update.xml.temp"
          if not manifest_path.is_file():
              raise FileNotFoundError(f"Missing staged update manifest: {manifest_path}")

          tree = ET.parse(manifest_path)
          root = tree.getroot()
          packages = root.find("./app/packages")
          if packages is None:
              raise ValueError("Update manifest does not contain app/packages.")

          seen = set()
          for package in packages.findall("package"):
              platform = (package.findtext("platform") or "").strip()
              architecture = (package.findtext("architecture") or "").strip()
              key = (platform, architecture)
              descriptor = assets.get(key)
              if descriptor is None:
                  continue

              final_path = final / descriptor["final_name"]
              data = final_path.read_bytes()
              digest = hashlib.sha256(data).hexdigest().upper()

              package.find("fileName").text = descriptor["final_name"]
              hash_node = package.find("hash")
              if hash_node is None:
                  hash_node = ET.SubElement(package, "hash")
              hash_node.set("algorithm", "SHA256")
              hash_node.text = digest

              size_node = package.find("size")
              if size_node is None:
                  size_node = ET.SubElement(package, "size")
              size_node.text = str(len(data))

              seen.add(key)

          missing = set(assets.keys()) - seen
          if missing:
              raise ValueError(f"Update manifest is missing package entries for: {sorted(missing)}")

          ET.indent(tree, space="  ")
          tree.write(final / "socle-update.xml", encoding="utf-8", xml_declaration=True)
          PY

          echo "Final release assets:"
          ls -lh final
          sha256sum final/*

      - name: Upload final assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release upload "${{ github.event.inputs.tag }}" \
            final/Socle-win-x64.zip \
            final/Socle-macos-arm64.zip \
            final/Socle-macos-x64.zip \
            final/socle-update.xml \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Delete staged temp assets
        if: success() && github.event.inputs.cleanup_temp_assets == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for asset in \
            "Socle-win-x64.zip.temp" \
            "Socle-macos-arm64.zip.temp" \
            "Socle-macos-x64.zip.temp" \
            "socle-update.xml.temp"
          do
            gh release delete-asset "${{ github.event.inputs.tag }}" "$asset" \
              --repo "${{ github.repository }}" \
              -y || true
          done
